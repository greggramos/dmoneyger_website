<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>D'Moneyger Loan Services</title>
  <link rel="icon" type="image/png" sizes="512x512" href="/image/logo.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <div class="floating-box">
      <!-- Logo + Heading Block -->
      <div class="logo-heading">
        <img src="/image/dmoneyger-logo.png" alt="D'Moneyger Logo" class="main-logo">
        <h1>Empowering Your Finances</h1>
      </div>

      <h4>
        Welcome to <b>D'Moneyger</b> Loan Services <br>
        One Call, One Solution.
      </h4>
      
      <p class="p1"><b>Need Instant CASH?</b> </p>
      <p class="p2"> MADALI • MABILIS • SIGURADO</p>

      <div class="auth-buttons">
        <button class="signup-btn">APPLY LOAN</button>
        <button class="login-btn">LOANS</button>
      </div>

      <!-- Features Section -->
      <div class="features">
        <div class="feature"><span class="icon">⚡</span> Fast Approval</div>
        <div class="divider"></div>
        <div class="feature"><span class="icon">🚫💵</span> No Advance Payment</div>
        <div class="divider"></div>
        <div class="feature"><span class="icon">💳</span> Easy Credit</div>
      </div>
    </div>
  </main>

  <footer>
    <p class="footnote">
      <b>Powered by:</b> <img src="/image/prismtechph-logo.png" alt="PRISM Tech Logo" class="footer-logo"> PRISM Tech PH
    </p>
  </footer>
</body>
</html>
