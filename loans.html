<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loan Options - D'Moneyger</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
<main>
  <div class="floating-box">
      <h1>Our Loan Options</h1>
      <p>Select the loan type that fits your needs.</p>

      <div class="loan-options">
        <div class="card">
          <i class="fas fa-user"></i>
          <h3>Personal Loan</h3>
          <p>Quick cash for everyday needs.</p>
        </div>
        <div class="card">
          <i class="fas fa-briefcase"></i>
          <h3>Business Loan</h3>
          <p>Support for entrepreneurs and SMEs.</p>
        </div>
        <div class="card">
          <i class="fas fa-first-aid"></i>
          <h3>Emergency Loan</h3>
          <p>Fast approval for urgent expenses.</p>
        </div>
        </div>

    <!-- Action Buttons -->
        <div class="auth-buttons">
          <button class="signup-btn" onclick="location.href='apply.html'">APPLY LOAN</button>
        </div>
      </div>
</main>

<footer>
  <p class="footnote">
    <b>Powered by:</b> 
    <img src="image/prismtechph-logo.png" alt="PRISM Tech Logo" class="footer-logo"> PRISM Tech PH
  </p>
  <div class="trust-badges">
    <span class="badge"><i class="fas fa-lock"></i> SSL Secure</span>
    <span class="badge"><i class="fas fa-handshake"></i> Trusted Partner</span>
    <span class="badge"><i class="fas fa-shield-alt"></i> Verified Loans</span>
  </div>
</footer>
