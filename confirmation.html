<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Loan Confirmation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <div class="floating-box">
      <h1>🎉 Application Received!</h1>
      <p id="details"></p>

      <button class="apply-btn" onclick="location.href='apply.html'">Apply Another Loan</button>
      <button class="login-btn" onclick="location.href='index.html'">Back to Home</button>
    </div>
  </main>

  <script>
    // Parse query parameters
    const params = new URLSearchParams(window.location.search);
    const transactionId = params.get("id");
    const name = params.get("name");
    const type = params.get("type");
    const amount = params.get("amount");

    document.getElementById("details").innerHTML = `
      Thank you, <b>${name}</b>!<br>
      Your <b>${type}</b> loan application for <b>₱${amount}</b> has been submitted.<br>
      Transaction ID: <b>${transactionId}</b>
    `;
  </script>

  <footer>
    <p class="footnote">
      <b>Powered by:</b> 
      <img src="image/prismtechph-logo.png" alt="PRISM Tech Logo" class="footer-logo"> PRISM Tech PH
    </p>
  </footer>
</body>
</html>
